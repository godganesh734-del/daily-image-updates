<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Image Updates</title>
    
    <script src="https://www.adsfire.online/assets/ads/ad.js" class="adScriptClass"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; text-align: center; }
        header { background: #222; color: white; padding: 30px 0; }
        .ad-container { margin: 20px auto; padding: 10px; background: #fff; max-width: 728px; min-height: 90px; border: 1px solid #ddd; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .card img { width: 100%; height: auto; display: block; }
        footer { margin-top: 50px; padding: 20px; background: #222; color: #888; }
    </style>
</head>
<body>

    <header>
        <h1>Latest Image Updates</h1>
        <p>Daily updates and fresh content</p>
    </header>

    <div class="ad-container">
        <p style="color:#999; font-size:12px;">ADVERTISEMENT</p>
        </div>

    <main class="gallery">
        <div class="card"><img src="https://i.ibb.co/7tRjmpH6/1.jpg"></div>
        <div class="card"><img src="https://i.ibb.co/bMkT5Q1B/2.jpg"></div>
        <div class="card"><img src="https://i.ibb.co/ds6YKnY3/3.jpg"></div>
        <div class="card"><img src="https://i.ibb.co/1Ggx6wb6/4.jpg"></div>
    </main>

    <footer>
        <p>&copy; 2026 Daily Image Updates</p>
    </footer>

    <script src="https://www.adsfire.online/assets/ads/ad.js" class="adScriptClass"></script>

</body>
</html>
